
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #result {
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>Password Generator</h1>

    <label for="length">Password length:</label>
    <input type="number" id="length" value="11" min="4" max="30">

    <h3>Choose character types:</h3>

    <label>
        <input type="checkbox" id="uppercase" checked>
        Uppercase letters (A-Z)
    </label>
    <br>

    <label>
        <input type="checkbox" id="lowercase" checked>
        Lowercase letters (a-z)
    </label>
    <br>

    <label>
        <input type="checkbox" id="numbers" checked>
        Numbers (0-9)
    </label>
    <br>

    <label>
        <input type="checkbox" id="symbols" checked>
        Special characters (!@#$%^&*)
    </label>
    <br><br>

    <button id="generateBtn" onclick="generatepassword()">
        Generate Password
    </button>

    <div
        id="loader"
        class="loader"
        style="display: none;"
        role="status"
        aria-label="Generating password"
    ></div>

    <p id="result">Your password will appear here</p>

    <script>
        function generatepassword() {

            // Step 1: Read and validate password length
            let passwordLength = Number(
                document.getElementById("length").value
            );

            if (
                !Number.isInteger(passwordLength) ||
                passwordLength < 4 ||
                passwordLength > 30
            ) {
                alert("Enter a whole number between 4 and 30.");
                return;
            }

            // Step 2: Read checkbox selections
            let useUppercase =
                document.getElementById("uppercase").checked;

            let useLowercase =
                document.getElementById("lowercase").checked;

            let useNumbers =
                document.getElementById("numbers").checked;

            let useSymbols =
                document.getElementById("symbols").checked;

            // Step 3: Build selected character groups
            let groups = [];

            if (useUppercase) {
                groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
            }

            if (useLowercase) {
                groups.push("abcdefghijklmnopqrstuvwxyz");
            }

            if (useNumbers) {
                groups.push("0123456789");
            }

            if (useSymbols) {
                groups.push("!@#$%^&*");
            }

            // Step 4: Validate character selections
            if (groups.length === 0) {
                alert("Select at least one character type.");
                return;
            }

            if (groups.length > passwordLength) {
                alert(
                    "Password length must be at least " +
                    groups.length + "."
                );
                return;
            }

            // Step 5: Show loader and hide button
            let button = document.getElementById("generateBtn");
            let loader = document.getElementById("loader");
            let result = document.getElementById("result");

            button.style.display = "none";
            loader.style.display = "block";
            result.textContent = "Generating password...";

            // Step 6: Generate the password after a 2-second delay
            setTimeout(function () {

                try {
                    // Secure random integer without modulo bias
                    function randomInt(max) {
                        const range = 4294967296;
                        const limit = Math.floor(range / max) * max;
                        const values = new Uint32Array(1);
                        let value;

                        do {
                            crypto.getRandomValues(values);
                            value = values[0];
                        } while (value >= limit);

                        return value % max;
                    }

                    // Combine selected character groups
                    let characters = groups.join("");
                    let passwordCharacters = [];

                    // Guarantee one character from every selected group
                    for (let group of groups) {
                        passwordCharacters.push(
                            group[randomInt(group.length)]
                        );
                    }

                    // Fill remaining positions
                    while (
                        passwordCharacters.length < passwordLength
                    ) {
                        let randomIndex = randomInt(characters.length);

                        passwordCharacters.push(
                            characters[randomIndex]
                        );
                    }

                    // Shuffle the characters
                    for (
                        let i = passwordCharacters.length - 1;
                        i > 0;
                        i--
                    ) {
                        let j = randomInt(i + 1);

                        [
                            passwordCharacters[i],
                            passwordCharacters[j]
                        ] = [
                            passwordCharacters[j],
                            passwordCharacters[i]
                        ];
                    }

                    // Convert array into a string
                    let password = passwordCharacters.join("");

                    // Display the password
                    result.textContent = password;

                    console.log(password);

                } catch (error) {
                    result.textContent =
                        "Unable to generate password. Please try again.";
                    console.error(error);

                } finally {
                    // Hide loader and restore button
                    loader.style.display = "none";
                    button.style.display = "inline-block";
                }

            }, 2000);
        }
    </script>

</body>
</html>
