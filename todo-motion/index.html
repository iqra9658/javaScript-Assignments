<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo-motion</title>
  </head>
  <body>
    <div id="app">
      <main class="todo-app">
        <p class="eyebrow">YOUR SPACE · YOUR PACE</p>
        <h1>Make room. <br>Get things done.</h1>
        <p class="subtitle">A little progress goes a long way.</p>
      <div class="task-input">
        <input type="text" id="text" placeholder="what needs doing?">
        <button id="btn" type="button">Add task +</button>
      </div>
      <ul id="tasklist"></ul>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
